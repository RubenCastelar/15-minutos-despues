<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Randomizador Futurista</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=2026-08-01-2" />
  </head>
  <body>
    <div class="ambient ambient-left"></div>
    <div class="ambient ambient-right"></div>

    <main class="app-shell">
      <section class="hero">
        <p class="persistent-tag">#15minutosdespués</p>
        <h1>
          Entrena tu memoria, concentración<br />
          y conexiones neuronales.
        </h1>
      </section>

      <section class="roulette-card">
        <div class="roulette-frame">
          <div class="focus-band"></div>
          <div class="roulette-window" id="roulette-window"></div>
        </div>

        <div class="result-panel">
          <span class="result-label">Selección final</span>
          <strong id="result-text">Esperando activación</strong>
        </div>

        <button id="spin-button" class="spin-button" type="button">
          Iniciar búsqueda
        </button>
      </section>

      <section class="session-panel" id="session-panel" aria-live="polite" aria-hidden="true" hidden>
        <button class="back-button" id="back-button" type="button" aria-label="Volver a elegir">
          ← Volver
        </button>
        <p class="persistent-tag">#15minutosdespués</p>
        <p class="session-label">Concepto seleccionado</p>
        <h2 class="session-concept" id="session-concept">Neuroplasticidad</h2>

        <div class="timer-orb" id="timer-orb" style="--timer-progress: 1;">
          <div class="timer-orb-inner">
            <span class="timer-label" id="timer-stage">Cronómetro 1</span>
            <strong class="timer-value" id="timer-value">15:00</strong>
          </div>
        </div>

        <button id="session-button" class="spin-button session-button" type="button">
          Empezar 15 min
        </button>
      </section>

      <footer class="social-footer">
        <a class="creator-link" href="https://instagram.com/rubi_castelar" target="_blank" rel="noreferrer">
          desarrollado por rubi_castelar
        </a>

        <nav class="social-links" aria-label="Redes sociales">
          <a
            class="social-link"
            href="https://instagram.com/rubi_castelar"
            target="_blank"
            rel="noreferrer"
            aria-label="Instagram"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M7.8 3h8.4A4.8 4.8 0 0 1 21 7.8v8.4a4.8 4.8 0 0 1-4.8 4.8H7.8A4.8 4.8 0 0 1 3 16.2V7.8A4.8 4.8 0 0 1 7.8 3Zm0 1.8A3 3 0 0 0 4.8 7.8v8.4a3 3 0 0 0 3 3h8.4a3 3 0 0 0 3-3V7.8a3 3 0 0 0-3-3H7.8Zm8.85 1.35a1.05 1.05 0 1 1 0 2.1 1.05 1.05 0 0 1 0-2.1ZM12 7.2A4.8 4.8 0 1 1 7.2 12 4.8 4.8 0 0 1 12 7.2Zm0 1.8A3 3 0 1 0 15 12a3 3 0 0 0-3-3Z"
              />
            </svg>
          </a>

          <a
            class="social-link"
            href="https://tiktok.com/@rubi_castelar"
            target="_blank"
            rel="noreferrer"
            aria-label="TikTok"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M14.1 3c.25 2.02 1.42 3.7 3.4 4.48v2.52a6.49 6.49 0 0 1-3.36-.93v5.1A5.17 5.17 0 1 1 9 9v2.66a2.53 2.53 0 1 0 2.53 2.53V3h2.57Z"
              />
            </svg>
          </a>

          <a
            class="social-link"
            href="https://www.youtube.com/@Rubi.Castelar"
            target="_blank"
            rel="noreferrer"
            aria-label="YouTube"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M21.3 7.2a2.95 2.95 0 0 0-2.08-2.08C17.45 4.65 12 4.65 12 4.65s-5.45 0-7.22.47A2.95 2.95 0 0 0 2.7 7.2 30.8 30.8 0 0 0 2.25 12a30.8 30.8 0 0 0 .45 4.8 2.95 2.95 0 0 0 2.08 2.08c1.77.47 7.22.47 7.22.47s5.45 0 7.22-.47a2.95 2.95 0 0 0 2.08-2.08 30.8 30.8 0 0 0 .45-4.8 30.8 30.8 0 0 0-.45-4.8ZM10.2 15.42V8.58L15.9 12l-5.7 3.42Z"
              />
            </svg>
          </a>
        </nav>
      </footer>
    </main>

    <script src="./app.js?v=2026-08-01-2"></script>
  </body>
</html>
